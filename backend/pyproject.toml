[project]
name = "rollwatch-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.10.4,<3.0",
    "httpx>=0.28.1,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "boto3>=1.35.94,<2.0",
    "prometheus-client>=0.21.1,<1.0",
    "python-dotenv>=1.0.1,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"
